name: Déploiement sur bornes.ivoire.tech

# Tout ce qui arrive sur `main` part en ligne. Le site n'a ni compilation ni dépendances :
# ce qui est dans le dépôt est, à l'octet près, ce que voit le visiteur.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deux déploiements simultanés écriraient dans le même répertoire avec `--delete`.
# Le second attend ; s'il en arrive un troisième, celui du milieu est abandonné —
# c'est de toute façon le dernier commit qui doit gagner.
concurrency:
  group: deploiement-bornes
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la clé SSH
        env:
          CLE: ${{ secrets.CLE_SSH_DEPLOIEMENT }}
        run: |
          test -n "$CLE" || { echo "::error::Le secret CLE_SSH_DEPLOIEMENT est vide ou absent."; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/deploiement
          chmod 600 ~/.ssh/deploiement
          # Empreinte du serveur fixée ici plutôt que `StrictHostKeyChecking=no` :
          # sans cela, le runner accepterait n'importe quelle machine se présentant
          # à cette adresse et lui enverrait la clé de déploiement.
          echo '185.98.137.69 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII4uqXqSsvI81iqieqJy4Ro8zHWqeHHEmdk3dakJ4FLD' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'FIN'
          Host bornes-deploiement
            HostName 185.98.137.69
            User deploy-bornes
            Port 22
            IdentityFile ~/.ssh/deploiement
            IdentitiesOnly yes
          FIN
          chmod 600 ~/.ssh/config

      - name: Envoyer le site
        env:
          HOTE: bornes-deploiement
        run: sh deploiement/deployer.sh --envoyer

      - name: Effacer la clé
        if: always()
        run: rm -f ~/.ssh/deploiement
