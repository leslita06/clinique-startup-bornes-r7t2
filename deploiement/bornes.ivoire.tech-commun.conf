# /etc/apache2/bornes.ivoire.tech-commun.conf
#
# Inclus par les DEUX blocs du vhost, :80 et :443.
#
# Les vhosts voisins (next15, scaleup) recopient ces réglages dans chaque bloc. Le jour où
# l'on corrige l'un sans l'autre, le site se met à répondre différemment selon le protocole,
# et rien ne le signale. Un seul fichier, inclus deux fois, rend cette divergence impossible.

<IfModule mod_headers.c>
    # Le HTML est la page elle-même : jamais de cache collant, sinon une mise à jour
    # resterait invisible pour qui a déjà visité le site.
    <FilesMatch "\.(html|htm)$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>

    # Les images n'ont PAS d'empreinte dans leur nom (img/e0.webp…). Un an « immutable »
    # serait donc faux : remplacer e0.webp ne changerait rien chez les visiteurs déjà venus.
    # Une journée : assez pour éviter les rechargements, assez court pour qu'un remplacement
    # d'image se voie le lendemain sans intervention.
    <LocationMatch "^/img/">
        Header set Cache-Control "public, max-age=86400"
    </LocationMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# Apache ne connaît pas toujours ces types : servis en octet-stream, le navigateur
# ignore l'image au lieu de l'afficher.
AddType image/webp .webp
AddType image/svg+xml .svg

# Cloudflare comprime déjà pour les visiteurs ; ceci vaut pour qui atteint l'origine
# directement, et ne coûte rien.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json image/svg+xml
</IfModule>
