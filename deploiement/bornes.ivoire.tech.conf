# /etc/apache2/sites-available/bornes.ivoire.tech.conf
#
# Site STATIQUE : Apache sert les fichiers directement, pas de proxy. Même forme que
# next15.ivoire.tech et scaleup.ivoire.tech, qui tournent déjà sur cette machine.
#
# Le certificat est le certificat COMMUN `ivoiretech-sites`, qui couvre déjà next15,
# admin et scaleup. On l'étend à `bornes` plutôt que d'en créer un quatrième : un seul
# renouvellement à surveiller au lieu de deux.
#
#   certbot --apache --expand -d next15.ivoire.tech -d admin.ivoire.tech \
#           -d scaleup.ivoire.tech -d bornes.ivoire.tech --cert-name ivoiretech-sites
#
# Le bloc :443 doit exister AVANT que Cloudflare ne soit mis en « proxy » : Cloudflare
# joint l'origine en HTTPS, et sans vhost :443 à ce nom Apache répond avec le vhost :443
# par défaut — c'est-à-dire un autre site. C'est exactement ce qui est arrivé à
# akta-partners.com, qui tombait sur Diaspora Connect.

<VirtualHost *:80>
    ServerName bornes.ivoire.tech
    DocumentRoot /var/www/bornes.ivoire.tech

    <Directory /var/www/bornes.ivoire.tech>
        Require all granted
        # Pas de .htaccess : toute la configuration tient dans ce fichier, relisible d'un bloc.
        AllowOverride None
        # Un répertoire sans index ne doit pas exposer sa liste de fichiers.
        Options -Indexes +FollowSymLinks
    </Directory>

    # Certbot y dépose ses fichiers de validation. Accessible même quand le reste
    # ne l'est pas, sinon un renouvellement échouerait en silence.
    <Directory /var/www/bornes.ivoire.tech/.well-known/acme-challenge>
        Require all granted
    </Directory>

    Include /etc/apache2/bornes.ivoire.tech-commun.conf

    ErrorLog  ${APACHE_LOG_DIR}/bornes.ivoire.tech-error.log
    CustomLog ${APACHE_LOG_DIR}/bornes.ivoire.tech-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName bornes.ivoire.tech
    DocumentRoot /var/www/bornes.ivoire.tech

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/ivoiretech-sites/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ivoiretech-sites/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    <Directory /var/www/bornes.ivoire.tech>
        Require all granted
        AllowOverride None
        Options -Indexes +FollowSymLinks
    </Directory>

    Include /etc/apache2/bornes.ivoire.tech-commun.conf

    ErrorLog  ${APACHE_LOG_DIR}/bornes.ivoire.tech-error.log
    CustomLog ${APACHE_LOG_DIR}/bornes.ivoire.tech-access.log combined
</VirtualHost>
</IfModule>
